name: Build Geode mod

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Build Android 64-bit mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: latest
          target: Android64
      - name: Upload .geode package
        uses: actions/upload-artifact@v4
        with:
          name: DeathQuote-Android64
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error
