name: Build MoreGames Android64

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/moregames-android64.yml"

jobs:
  build:
    name: MoreGames Android ARM64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MoreGames source
        uses: actions/checkout@v4
        with:
          repository: iArtie/FreeGames
          ref: master

      - name: Build MoreGames for Android64
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          android-ndk-version: 27.2.12479018
          target: Android64
          combine: true

      - name: Upload MoreGames .geode package
        uses: actions/upload-artifact@v4
        with:
          name: MoreGames-Android64
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error
